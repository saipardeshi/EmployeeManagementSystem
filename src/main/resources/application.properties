spring.application.name=demo-7

server.port=${PORT:8081}

# Database configuration (supports environment variables for cloud deployment)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mydb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Sai@1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Multipart file upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# Storage folder for employee uploaded photos
app.upload-dir=${UPLOAD_DIR:uploads}

# Allowed CORS origins
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
